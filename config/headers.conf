# Optional compliance-report column visibility profile (INI, UTF-8).
# Loaded ONLY with: compliance-report --custom-headers config/headers.conf
# Use exact report column names. Values must be true or false.
# Unlisted columns are hidden; the report keeps its existing column order.
# Microcosmos identity columns and env are ignored when absent from the input.
# Add a section for an extra input column (for example [Owner]) to display it.
# Copy this file to headers2.conf to maintain a separate profile.

