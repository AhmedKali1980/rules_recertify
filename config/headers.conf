# Compliance report visibility profile (UTF-8 INI).
# Loaded only with --custom-headers PATH; --debug and the default mode ignore this file.
# true displays the column/sheet; false omits it. Unlisted columns are omitted.
# Detail columns use their public names; legacy detail names remain accepted aliases.
# Reference columns use column:<sheet>:<name> to keep them independent of detail columns.
# New reference sheets are opt-in in older profiles; this template enables all sheets and columns.
# To include an extra input field, add its own [Header name] section.

